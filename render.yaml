# Creates a paid, always-on model-only service after owner approval.
services:
  - type: web
    name: woogongisan-model
    runtime: python
    plan: 0.5c-512mb
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python model_server.py --host 0.0.0.0
    healthCheckPath: /healthz
    disk:
      name: model-publications
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WOOGONG_STATE_DIR
        value: /var/data/woogong
    buildFilter:
      paths:
        - model_server.py
        - pipeline.py
        - market_data.py
        - notify.py
        - requirements.txt
        - active_model.json
        - strategy_parameters.json
        - models/**
        - data/**
        - render.yaml
