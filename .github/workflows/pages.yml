name: Publish Woogongisan
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/*.json'
      - 'site/history/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: woogong-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/portfolio_web.mjs
      - run: node tests/performance_web.mjs
      - run: node tests/free_scheduler.mjs
      - run: python tools/build_signal_bundle.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
