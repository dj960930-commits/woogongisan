name: Refresh wave charts
on:
  workflow_dispatch:
  schedule:
    - cron: '43 2,10,18,22 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: woogong-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/build_waves.py
      - name: Persist wave feed
        run: |
          git config user.name woogong-data
          git config user.email woogong-data@users.noreply.github.com
          git add site/waves.json
          git diff --cached --quiet || git commit -m "Refresh completed wave chart bars"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
